<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>소리 질러 점프!</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #1b1d2a; color: #f2f2f2;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px; gap: 10px;
    -webkit-user-select: none; user-select: none;
  }
  h1 { font-size: 20px; letter-spacing: -0.5px; }
  /* 캔버스와 안내창을 같은 칸에 겹쳐 둠: 안내 글이 길면 칸이 같이 늘어나서 넘치지 않음 */
  #wrap { display: grid; width: 100%; max-width: 820px; }
  #wrap > * { grid-area: 1 / 1; }
  canvas {
    align-self: start;
    width: 100%; display: block; border-radius: 14px;
    background: linear-gradient(#8fd3ff, #d9f1ff);
    touch-action: manipulation;
  }
  #overlay {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(20, 22, 35, 0.72); border-radius: 14px; text-align: center; padding: 16px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { font-size: 26px; }
  #overlay p { font-size: 14px; opacity: 0.85; line-height: 1.5; }
  button {
    font: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 999px;
    padding: 12px 28px; background: #ffcf3f; color: #222; cursor: pointer;
  }
  button:active { transform: scale(0.97); }
  #diffRow { display: flex; gap: 8px; }
  .diffBtn {
    font-size: 15px; padding: 8px 18px; background: #3a3f57; color: #f2f2f2;
  }
  .diffBtn.on { background: #5ad17a; color: #10261a; }
  /* 휴대폰처럼 좁은 화면 */
  @media (max-width: 600px) {
    #overlay { gap: 8px; padding: 12px 10px; }
    #overlay h2 { font-size: 19px; }
    #overlay p { font-size: 12.5px; line-height: 1.45; }
    button { font-size: 15px; padding: 9px 22px; }
    .diffBtn { font-size: 14px; padding: 7px 14px; }
    .row label { width: 66px; font-size: 13px; }
  }
  #panel {
    width: 100%; max-width: 820px; background: #262a3b; border-radius: 14px;
    padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .row label { width: 72px; flex-shrink: 0; opacity: 0.85; }
  .meter {
    position: relative; flex: 1; height: 18px; background: #151724; border-radius: 9px; overflow: hidden;
  }
  .bar { height: 100%; width: 0%; background: #5ad17a; transition: width 50ms linear; }
  .thrLine { position: absolute; top: 0; bottom: 0; width: 3px; background: #ff5a5a; }
  input[type=range] { flex: 1; accent-color: #ffcf3f; }
  .val { width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  #err { color: #ff8a8a; font-size: 13px; display: none; }
</style>
</head>
<body>
  <h1>🎤 소리 질러 점프!</h1>

  <div id="wrap">
    <canvas id="game" width="820" height="360"></canvas>
    <div id="overlay">
      <h2 id="ovTitle">목소리로 점프하세요</h2>
      <p id="ovText">설정한 크기보다 크게 소리를 내면 캐릭터가 점프해요. 크게 낼수록 더 높이 뛰어요!<br>
        "삐~"처럼 <b>높은 소리</b>를 내면 총알이 나가서 장애물을 부숴요.</p>
      <div id="diffRow">
        <button class="diffBtn" data-diff="easy">🐣 쉬움</button>
        <button class="diffBtn" data-diff="normal">🔥 보통</button>
      </div>
      <button id="startBtn">마이크 켜고 시작</button>
      <p id="err"></p>
    </div>
  </div>

  <div id="panel">
    <div class="row">
      <label>현재 소리</label>
      <div class="meter"><div class="bar" id="level"></div><div class="thrLine" id="thrLine"></div></div>
      <span class="val" id="levelVal">0</span>
    </div>
    <div class="row">
      <label>점프 기준</label>
      <input type="range" id="thr" min="5" max="90" value="30">
      <span class="val" id="thrVal">30</span>
    </div>
    <div class="row">
      <label>현재 음높이</label>
      <div class="meter"><div class="bar" id="pitchBar"></div><div class="thrLine" id="pitchLine"></div></div>
      <span class="val" id="pitchVal">-</span>
    </div>
    <div class="row">
      <label>발사 음높이</label>
      <input type="range" id="pitchThr" min="300" max="1200" step="10" value="600">
      <span class="val" id="pitchThrVal">600Hz</span>
    </div>
    <div class="row">
      <label>마이크 감도</label>
      <input type="range" id="gain" min="1" max="10" step="0.5" value="3">
      <span class="val" id="gainVal">3</span>
    </div>
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = H - 60;

const $ = id => document.getElementById(id);
const overlay = $('overlay'), startBtn = $('startBtn'), errEl = $('err');
const levelEl = $('level'), levelVal = $('levelVal'), thrLine = $('thrLine');
const thrInput = $('thr'), gainInput = $('gain'), pitchThrInput = $('pitchThr');
const pitchBar = $('pitchBar'), pitchLine = $('pitchLine'), pitchValEl = $('pitchVal');

let threshold = +thrInput.value;
let gain = +gainInput.value;
let pitchThr = +pitchThrInput.value;

function loadSettings() {
  try {
    const s = JSON.parse(localStorage.getItem('voiceJumpSettings') || '{}');
    if (s.threshold) thrInput.value = threshold = s.threshold;
    if (s.gain) gainInput.value = gain = s.gain;
    if (s.pitchThr) pitchThrInput.value = pitchThr = s.pitchThr;
  } catch (e) {}
}
function saveSettings() {
  try { localStorage.setItem('voiceJumpSettings', JSON.stringify({ threshold, gain, pitchThr })); } catch (e) {}
}
// 음높이 막대: 100Hz~1500Hz를 로그 눈금으로
const PITCH_MIN = 100, PITCH_MAX = 1500;
function pitchToPct(f) {
  if (!f) return 0;
  return Math.max(0, Math.min(100, Math.log(f / PITCH_MIN) / Math.log(PITCH_MAX / PITCH_MIN) * 100));
}
function syncLabels() {
  $('thrVal').textContent = threshold;
  $('gainVal').textContent = gain;
  $('pitchThrVal').textContent = pitchThr + 'Hz';
  thrLine.style.left = threshold + '%';
  pitchLine.style.left = pitchToPct(pitchThr) + '%';
}
loadSettings(); syncLabels();
thrInput.oninput = () => { threshold = +thrInput.value; syncLabels(); saveSettings(); };
gainInput.oninput = () => { gain = +gainInput.value; syncLabels(); saveSettings(); };
pitchThrInput.oninput = () => { pitchThr = +pitchThrInput.value; syncLabels(); saveSettings(); };

// ---------- 마이크 ----------
let analyser = null, buf = null, volume = 0, sampleRate = 48000, pitch = 0;

// 자기상관으로 음높이(Hz) 찾기. 소리가 너무 작거나 음이 뚜렷하지 않으면 0
// 빠르게 하려고 소리를 절반으로 줄여서(다운샘플) 계산하고, 가장 최근 소리 구간을 기준으로 봄
const PITCH_WIN = 512;
let dbuf = null, corr = null;
function detectPitch() {
  const n = buf.length >> 1, sr = sampleRate / 2;
  if (!dbuf) dbuf = new Float32Array(n);
  for (let j = 0; j < n; j++) dbuf[j] = (buf[2 * j] + buf[2 * j + 1]) * 0.5;

  const s = n - PITCH_WIN; // 가장 최근 구간의 시작
  let energy = 0;
  for (let i = 0; i < PITCH_WIN; i++) energy += dbuf[s + i] * dbuf[s + i];
  if (Math.sqrt(energy / PITCH_WIN) < 0.01) return 0;

  const minLag = Math.floor(sr / PITCH_MAX);
  const maxLag = Math.min(s - 2, Math.ceil(sr / 80));
  if (!corr || corr.length < maxLag + 2) corr = new Float32Array(maxLag + 2);

  let best = 0;
  for (let lag = minLag; lag <= maxLag + 1; lag++) {
    let xy = 0, yy = 0;
    const o = s - lag;
    for (let i = 0; i < PITCH_WIN; i++) {
      const y = dbuf[o + i];
      xy += dbuf[s + i] * y; yy += y * y;
    }
    corr[lag] = (2 * xy) / (energy + yy + 1e-9); // -1~1, 1이면 완벽히 반복
    if (corr[lag] > best) best = corr[lag];
  }
  if (best < 0.6) return 0;

  // 가장 높은 봉우리의 90% 이상인 첫 봉우리 = 기본음 (한 옥타브 낮게 잡는 실수 방지)
  for (let lag = minLag + 1; lag <= maxLag; lag++) {
    const c = corr[lag];
    if (c >= best * 0.9 && c >= corr[lag - 1] && c >= corr[lag + 1]) {
      const a = corr[lag - 1], b = corr[lag + 1];
      const shift = (a - b) / (2 * (a - 2 * c + b) || 1);
      return sr / (lag + shift);
    }
  }
  return 0;
}

async function initMic() {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  if (ac.state === 'suspended') await ac.resume();
  sampleRate = ac.sampleRate;
  const src = ac.createMediaStreamSource(stream);
  analyser = ac.createAnalyser();
  analyser.fftSize = 2048;
  buf = new Float32Array(analyser.fftSize);
  src.connect(analyser);
}

function readVolume() {
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(buf);
  // 크기는 가장 최근 512개 샘플(약 0.01초)만 보고 계산 → 소리를 내자마자 반응
  const VOL_WIN = 512;
  let sum = 0;
  for (let i = buf.length - VOL_WIN; i < buf.length; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / VOL_WIN);
  const v = Math.min(100, rms * gain * 300);
  // 커질 때는 바로, 작아질 때만 부드럽게
  volume = v > volume ? v : volume * 0.6 + v * 0.4;
  // 조용할 때는 음높이 계산을 건너뜀 (휴대폰에서 버벅임 방지)
  pitch = volume >= SHOOT_MIN_VOLUME ? detectPitch() : 0;
  return volume;
}

// ---------- 난이도 ----------
const DIFFS = {
  easy: {   // 아이용: 느리고, 장애물이 낮고 드문드문, 하트 3개
    label: '쉬움', startSpeed: 4, accel: 0.001, maxSpeed: 7,
    gravity: 0.6, jumpMin: 12, jumpExtra: 5,
    tallChance: 0.15, shortH: [24, 14], tallH: [44, 12], obsW: [20, 12],
    flyScore: 800, flyChance: 0.1,
    gapMin: 80, gapRand: 70, hitPad: 10, lives: 3, highFrames: 2,
  },
  normal: { // 원래 난이도
    label: '보통', startSpeed: 6, accel: 0.0025, maxSpeed: 99,
    gravity: 0.9, jumpMin: 13, jumpExtra: 8,
    tallChance: 0.35, shortH: [32, 18], tallH: [60, 20], obsW: [22, 16],
    flyScore: 400, flyChance: 0.2,
    gapMin: 38, gapRand: 60, hitPad: 6, lives: 1, highFrames: 2,
  },
};
let diffKey = 'easy';
try { const d = localStorage.getItem('voiceJumpDiff'); if (DIFFS[d]) diffKey = d; } catch (e) {}
let D = DIFFS[diffKey];

function bestKey() { return diffKey === 'normal' ? 'voiceJumpBest' : 'voiceJumpBest_' + diffKey; }
function loadBest() { try { best = +localStorage.getItem(bestKey()) || 0; } catch (e) { best = 0; } }

function setDiff(key) {
  diffKey = key; D = DIFFS[key];
  try { localStorage.setItem('voiceJumpDiff', key); } catch (e) {}
  for (const btn of document.querySelectorAll('.diffBtn')) btn.classList.toggle('on', btn.dataset.diff === key);
  loadBest();
}

// ---------- 게임 상태 ----------
const player = { x: 110, y: GROUND, w: 44, h: 50, vy: 0, onGround: true, squash: 0 };
let obstacles = [], clouds = [], particles = [], bullets = [];
let speed, score, best = 0, running = false, spawnTimer, frame = 0;
let shootCooldown = 0, highFrames = 0, muzzle = 0, lives = 1, invincible = 0;
const SHOOT_COOLDOWN = 14;   // 연사 간격(프레임)
const SHOOT_MIN_VOLUME = 8;  // 이보다 작은 소리는 무시
const INVINCIBLE_FRAMES = 90; // 부딪힌 뒤 잠깐 무적(약 1.5초)

function reset() {
  player.y = GROUND; player.vy = 0; player.onGround = true;
  obstacles = []; particles = []; bullets = [];
  speed = D.startSpeed; score = 0; spawnTimer = 90; frame = 0;
  shootCooldown = 0; highFrames = 0; muzzle = 0;
  lives = D.lives; invincible = 0;
}

function shoot() {
  if (shootCooldown > 0) return;
  shootCooldown = SHOOT_COOLDOWN;
  muzzle = 5;
  bullets.push({ x: player.x + player.w, y: player.y - player.h * 0.6, vx: 14 });
}

function explode(o) {
  const cx = o.x + o.w / 2, cy = o.y + o.h / 2;
  const color = o.flying ? '122,79,209' : '47,143,78';
  for (let i = 0; i < 18; i++) {
    const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 30, color, size: 5 });
  }
}

for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 30 + Math.random() * 120, s: 0.6 + Math.random() * 0.8 });

function jump(power) {
  if (!player.onGround) return;
  // 기준을 넘은 만큼 더 높이
  const extra = Math.min(1, Math.max(0, (power - threshold) / Math.max(10, 100 - threshold)));
  player.vy = -D.jumpMin - extra * D.jumpExtra;
  player.onGround = false;
  for (let i = 0; i < 8; i++) {
    particles.push({ x: player.x + player.w / 2, y: GROUND, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 3, life: 25 });
  }
}

const rnd = ([base, range]) => base + Math.random() * range;

function spawnObstacle() {
  const tall = Math.random() < D.tallChance;
  const h = rnd(tall ? D.tallH : D.shortH);
  const w = rnd(D.obsW);
  const flying = score > D.flyScore && Math.random() < D.flyChance;
  obstacles.push({ x: W + 10, w, h: flying ? 26 : h, y: flying ? GROUND - 95 : GROUND - h, flying });
  const minGap = Math.max(D.gapMin, D.gapMin + 47 - speed * 3);
  spawnTimer = minGap + Math.random() * D.gapRand;
}

function hit(a, b) {
  const pad = D.hitPad;
  return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x &&
         a.y - a.h + pad < b.y + b.h && a.y > b.y + pad;
}

function update() {
  const v = readVolume();
  levelEl.style.width = v + '%';
  levelEl.style.background = v >= threshold ? '#ff9f3f' : '#5ad17a';
  levelVal.textContent = Math.round(v);

  const isHigh = pitch >= pitchThr && v >= SHOOT_MIN_VOLUME;
  pitchBar.style.width = pitchToPct(pitch) + '%';
  pitchBar.style.background = isHigh ? '#ff9f3f' : '#5aa8d1';
  pitchValEl.textContent = pitch ? Math.round(pitch) + 'Hz' : '-';

  if (!running) return;
  frame++;

  // 높은 소리면 점프 대신 발사, 아니면 크기로 점프
  highFrames = isHigh ? highFrames + 1 : 0;
  if (shootCooldown > 0) shootCooldown--;
  if (muzzle > 0) muzzle--;
  if (highFrames >= D.highFrames) shoot();
  else if (!isHigh && v >= threshold) jump(v);

  player.vy += D.gravity;
  player.y += player.vy;
  if (player.y >= GROUND) {
    if (!player.onGround) player.squash = 8;
    player.y = GROUND; player.vy = 0; player.onGround = true;
  }
  if (player.squash > 0) player.squash--;
  if (invincible > 0) invincible--;

  speed = Math.min(D.maxSpeed, speed + D.accel);
  score += speed * 0.1;

  if (--spawnTimer <= 0) spawnObstacle();
  for (const o of obstacles) o.x -= speed;
  obstacles = obstacles.filter(o => o.x + o.w > -10);

  for (const c of clouds) { c.x -= speed * 0.15 * c.s; if (c.x < -80) { c.x = W + 40; c.y = 30 + Math.random() * 120; } }
  for (const p of particles) { p.x += p.vx - speed * 0.3; p.y += p.vy; p.vy += 0.2; p.life--; }
  particles = particles.filter(p => p.life > 0);

  // 총알 이동 + 장애물 맞히기
  for (const b of bullets) {
    b.x += b.vx;
    for (const o of obstacles) {
      if (!o.dead && b.x + 10 > o.x && b.x < o.x + o.w && b.y + 3 > o.y && b.y - 3 < o.y + o.h) {
        o.dead = true; b.dead = true;
        explode(o);
        score += 20;
        break;
      }
    }
  }
  bullets = bullets.filter(b => !b.dead && b.x < W + 20);
  obstacles = obstacles.filter(o => !o.dead);

  // 부딪히면 하트 하나 잃고 잠깐 무적. 하트가 없으면 게임 오버
  if (invincible > 0) return;
  const box = { x: player.x, y: player.y, w: player.w, h: player.h };
  for (const o of obstacles) {
    if (hit(box, o)) {
      lives--;
      if (lives <= 0) return gameOver();
      o.dead = true; explode(o);
      invincible = INVINCIBLE_FRAMES;
      obstacles = obstacles.filter(x => !x.dead);
      return;
    }
  }
}

function gameOver() {
  running = false;
  const s = Math.floor(score);
  if (s > best) { best = s; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
  $('ovTitle').textContent = '게임 오버!';
  $('ovText').innerHTML = `점수 <b>${s}</b> · 최고 ${best} (${D.label})<br>다시 하려면 버튼을 누르세요.`;
  startBtn.textContent = '다시 하기';
  overlay.classList.remove('hidden');
}

// ---------- 그리기 ----------
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  for (const c of clouds) {
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 34 * c.s, 14 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(c.x + 20 * c.s, c.y - 8 * c.s, 22 * c.s, 14 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // 땅
  ctx.fillStyle = '#6bbf59'; ctx.fillRect(0, GROUND, W, 14);
  ctx.fillStyle = '#a0764a'; ctx.fillRect(0, GROUND + 14, W, H - GROUND);
  ctx.fillStyle = '#8a6239';
  const off = (frame * speed) % 40;
  for (let x = -off; x < W; x += 40) ctx.fillRect(x, GROUND + 26, 18, 4);

  // 장애물
  for (const o of obstacles) {
    if (o.flying) {
      ctx.fillStyle = '#7a4fd1';
      roundRect(o.x, o.y, o.w, o.h, 8); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.fillRect(o.x + 6, o.y + 8, 5, 5);
    } else {
      ctx.fillStyle = '#2f8f4e';
      roundRect(o.x, o.y, o.w, o.h, 6); ctx.fill();
      ctx.fillStyle = '#257540';
      ctx.fillRect(o.x + o.w / 2 - 2, o.y + 6, 4, o.h - 10);
    }
  }

  for (const p of particles) {
    ctx.fillStyle = `rgba(${p.color || '160,118,74'},${Math.min(1, p.life / 25)})`;
    const s = p.size || 4;
    ctx.fillRect(p.x, p.y, s, s);
  }

  // 총알
  for (const b of bullets) {
    ctx.fillStyle = 'rgba(255,207,63,0.35)';
    ctx.fillRect(b.x - 14, b.y - 2, 14, 4);
    ctx.fillStyle = '#ffcf3f';
    ctx.beginPath(); ctx.ellipse(b.x + 4, b.y, 7, 3.5, 0, 0, Math.PI * 2); ctx.fill();
  }

  // 플레이어 (착지하면 살짝 찌그러짐)
  const sq = player.squash / 8;
  const pw = player.w * (1 + sq * 0.2), ph = player.h * (1 - sq * 0.2);
  const px = player.x - (pw - player.w) / 2, py = player.y - ph;
  // 부딪힌 뒤 무적일 때 깜빡임
  ctx.globalAlpha = invincible > 0 && Math.floor(invincible / 6) % 2 ? 0.3 : 1;
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(player.x + player.w / 2, GROUND + 4, 20, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff7a59';
  roundRect(px, py, pw, ph, 14); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(px + pw * 0.68, py + ph * 0.32, 8, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(px + pw * 0.72, py + ph * 0.32, 4, 0, Math.PI * 2); ctx.fill();
  // 입: 소리가 클수록 크게 벌림
  const mouth = Math.min(10, volume / 8);
  ctx.beginPath(); ctx.ellipse(px + pw * 0.75, py + ph * 0.65, 6, 1 + mouth, 0, 0, Math.PI * 2); ctx.fill();
  // 발사 순간 번쩍
  if (muzzle > 0) {
    ctx.fillStyle = `rgba(255,230,120,${muzzle / 5})`;
    ctx.beginPath(); ctx.arc(px + pw + 4, player.y - player.h * 0.6, 6 + muzzle * 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 하트 (목숨이 2개 이상인 난이도에서만)
  if (D.lives > 1) {
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'left';
    let hearts = '';
    for (let i = 0; i < D.lives; i++) hearts += i < lives ? '❤️' : '🤍';
    ctx.fillText(hearts, 16, 38);
  }

  // 점수
  ctx.fillStyle = '#1b1d2a';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`${Math.floor(score)}`, W - 20, 36);
  ctx.font = '14px sans-serif';
  ctx.fillText(`최고 ${best}`, W - 20, 56);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

// ---------- 시작 ----------
startBtn.onclick = async () => {
  errEl.style.display = 'none';
  if (!analyser) {
    try {
      await initMic();
    } catch (e) {
      errEl.style.display = 'block';
      errEl.textContent = '마이크를 쓸 수 없어요. 브라우저에서 마이크 권한을 허용했는지 확인해 주세요. (https 주소나 PC에서 직접 연 파일에서만 동작해요)';
      return;
    }
  }
  reset();
  overlay.classList.add('hidden');
  running = true;
};

// 테스트용: 스페이스바/화면 탭으로 점프, F키로 발사
window.addEventListener('keydown', e => {
  if (!running) return;
  if (e.code === 'Space') { e.preventDefault(); jump(threshold); }
  if (e.code === 'KeyF') shoot();
});
canvas.addEventListener('pointerdown', () => { if (running) jump(threshold); });

for (const btn of document.querySelectorAll('.diffBtn')) btn.onclick = () => setDiff(btn.dataset.diff);
setDiff(diffKey);
reset();
loop();
</script>
